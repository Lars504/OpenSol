[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "open_sol"
dynamic = ["version"]
description = "GPU (cupy) / CPU 1D-3D multiphysics: FDTD / FDFD / EME / nonlinear electromagnetics, modes, heat, currents, magnetics, semiconductors, mechanics, acoustics, fluid; FEM on triangles / tetrahedra"
readme = "README.md"
requires-python = ">=3.11"
# cupy (GPU backend, optional: without it everything runs on the CPU backend) has a CUDA-specific wheel: install the
# matching cupy-cudaXXx first, or use an extra below.
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x"]
cuda11 = ["cupy-cuda11x"]
gui = ["PySide6", "pyqtgraph"]
# cuDSS sparse direct solver on the GPU (back ends / factorizations 'cudss', 'cudss_mixed'); [cu13] for CUDA 13
cudss = ["nvmath-python[cu12]"]
# Multicore host sparse direct solvers (back ends / factorizations 'mumps' / 'pardiso' + '_mixed'), never required.
# MUMPS (CeCILL-C library, BSD wrapper; not bundled): conda install -c conda-forge python-mumps is recommended, pip
# builds the wrapper against an installed MUMPS
mumps = ["python-mumps"]
# Intel MKL PARDISO through pydiso (MIT; MKL under the Intel Simplified Software License): x86-64 only, Linux / Windows
# wheels pull MKL; threadpoolctl (BSD) lets open_sol hold numpy's OpenBLAS threads back while PARDISO works
pardiso = ["pydiso", "threadpoolctl"]

[tool.setuptools.dynamic]
version = { attr = "open_sol.__version__" }

[tool.setuptools.packages.find]
include = ["open_sol*"]

[tool.setuptools.package-data]
open_sol = ["api_reference.md", "api_templates.md", "mesh_study/models/*.json"]
