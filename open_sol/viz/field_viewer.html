<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field viewer</title>
<!-- open_sol field viewer: one self-contained page (no network). viz/field_viewer.py fills the data block below.
     The camera, colour maps and recording blocks follow viz/mode_player.html: keep the two in step. The Plot
     settings (fig) repeat the keys of field_viewer.figure_settings: change both. -->
<style>
:root {
  --bg: #f4f5f7;
  --panel: #ffffff;
  --panel-2: #f8f9fb;
  --ink: #16181d;
  --ink-2: #4a5160;
  --ink-3: #7c8494;
  --rule: #e2e5eb;
  --accent: #2f6fdf;
  --accent-ink: #ffffff;
  --view-top: #ffffff;
  --view-bottom: #e9ecf2;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 8px 24px rgba(16, 24, 40, 0.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f13;
    --panel: #151820;
    --panel-2: #1a1e27;
    --ink: #eef0f4;
    --ink-2: #b4bac6;
    --ink-3: #7d8594;
    --rule: #262b36;
    --accent: #6ea0ff;
    --accent-ink: #0b0d12;
    --view-top: #1b1f29;
    --view-bottom: #0f1117;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f13;
  --panel: #151820;
  --panel-2: #1a1e27;
  --ink: #eef0f4;
  --ink-2: #b4bac6;
  --ink-3: #7d8594;
  --rule: #262b36;
  --accent: #6ea0ff;
  --accent-ink: #0b0d12;
  --view-top: #1b1f29;
  --view-bottom: #0f1117;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.num { font-variant-numeric: tabular-nums; }
.app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; gap: 12px; padding: 16px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
header h1 { font-size: 18px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
header p { margin: 2px 0 0; color: var(--ink-3); font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow);
        min-height: 0; position: relative; overflow: hidden; }
.view { background: linear-gradient(180deg, var(--view-top), var(--view-bottom)); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl:active { cursor: grabbing; }
#axes { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.hint { position: absolute; left: 18px; bottom: 14px; font-size: 11px; color: var(--ink-3); pointer-events: none; }
/* resize grip at the lower right corner of a face-on map (DOM, so pictures leave it out) */
.grip { position: absolute; width: 12px; height: 12px; cursor: nwse-resize; touch-action: none; z-index: 2;
        border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); opacity: 0.7; }
.grip:hover { border-color: var(--accent); opacity: 1; }
.grip[hidden] { display: none; }
/* Plot settings: a panel over the view (the canvas keeps its size, so the picture is exported as shown) */
.settings { position: absolute; right: 14px; bottom: 14px; width: 310px; max-height: calc(100% - 28px); overflow: auto;
            background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow);
            font-size: 12px; color: var(--ink-2); z-index: 3; }
.settings[hidden] { display: none; }
.settings .head { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px 12px;
                  border-bottom: 1px solid var(--rule); color: var(--ink); font-weight: 600; cursor: move;
                  touch-action: none; user-select: none; }
.settings .rows { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px 8px; align-items: center;
                  padding: 10px 12px 12px; }
.settings .rows label { white-space: nowrap; }
.settings .rows h2 { grid-column: 1 / 4; margin: 6px 0 0; font-size: 11px; font-weight: 600; color: var(--ink-3); }
                     /* no uppercase: the headings name units (mm, V^2/m^2) */
.settings .rows h2:first-child { margin-top: 0; }
.settings .wide { grid-column: 2 / 4; }
.settings input[type="number"], .settings select { width: 100%; min-width: 0; font: inherit; font-size: 12px;
  color: var(--ink); background: var(--panel-2); border: 1px solid var(--rule); border-radius: 6px; padding: 3px 6px; }
.settings input:disabled { opacity: 0.45; }
.settings input.bad { border-color: #e5484d; }
.settings textarea { grid-column: 1 / 4; width: 100%; height: 52px; resize: vertical; color: var(--ink-2);
                     font: 11px ui-monospace, "Cascadia Mono", Consolas, monospace; background: var(--panel-2);
                     border: 1px solid var(--rule); border-radius: 6px; padding: 4px 6px; }
.settings .buttons { grid-column: 1 / 4; display: flex; gap: 8px; justify-content: flex-end; }
.settings button { font-size: 12px; padding: 4px 9px; }
.rec { position: absolute; right: 18px; top: 16px; display: none; align-items: center; gap: 6px; font-size: 12px;
       font-weight: 600; color: #e5484d; }
.rec::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #e5484d; }
.rec.on { display: flex; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; background: var(--panel);
            border: 1px solid var(--rule); border-radius: 12px; padding: 10px 14px; box-shadow: var(--shadow); }
.group { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
.group label { white-space: nowrap; }
button, select { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel-2);
                 border: 1px solid var(--rule); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
button:hover, select:hover { border-color: var(--ink-3); }
button:disabled, select:disabled { opacity: 0.45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); min-width: 76px;
                 font-weight: 600; }
button.icon { padding: 5px 8px; min-width: 32px; }
button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
input[type="range"] { width: 110px; accent-color: var(--accent); }
input#frame { width: 180px; }
.val { min-width: 42px; color: var(--ink); }
.spacer { flex: 1; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); text-align: center;
         padding: 24px; }
.empty[hidden], .group[hidden] { display: none; }   /* the author display above would beat [hidden]: the empty overlay must not
                                      cover the canvas and take its pointer input */
body.present .controls, body.present header p, body.present .hint, body.present .settings, body.present .grip { display: none; }
body.present .app { padding: 10px; gap: 10px; }
@media (max-width: 820px) {
  .app { height: auto; min-height: 100vh; }
  .view { aspect-ratio: 4 / 3; }
  .hint { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1 id="title">Field viewer</h1>
      <p id="subtitle"></p>
    </div>
  </header>
  <section class="card view" aria-label="Field">
    <canvas id="gl"></canvas>
    <canvas id="axes"></canvas>
    <div class="hint" id="hint">Drag to rotate · Right- or Shift-drag to pan · Scroll to zoom · Double-click to reset · Drag the colour bar, material legend or scale bar to move it, the plot corner to resize</div>
    <div class="grip" id="grip" hidden title="Drag to resize the plot (double-click: full size)"></div>
    <div class="rec" id="rec">REC</div>
    <div class="empty" id="empty" hidden></div>
    <div class="settings" id="settings" hidden>
      <div class="head" id="settingshead"><span>Plot settings</span>
        <button class="icon" id="settingsclose" title="Close">&#215;</button></div>
      <div class="rows">
        <h2>Font size (px)</h2>
        <label for="fs_font_size">Axes, colour bar</label>
        <input type="number" id="fs_font_size" class="wide" min="6" max="40" step="1" title="Font size of the axis ticks, the axis titles and the colour bar (6 - 40 px; applied as typed)">
        <label for="fs_title_size">Heading</label>
        <input type="number" id="fs_title_size" min="8" max="72" step="1" title="Font size of the heading (8 - 72 px; applied as typed)">
        <select id="fs_title" title="Where the heading (frame label and field) is drawn">
          <option value="top_left">Top left</option><option value="top_center">Top centre</option>
          <option value="top_right">Top right</option><option value="off">Off</option></select>
        <h2 id="fs_colorhead">Colour limits</h2>
        <label for="fs_color_min">Min / max</label>
        <input type="number" id="fs_color_min" step="any" title="Lowest value of the colour scale (empty: automatic, the grey value; Enter applies)">
        <input type="number" id="fs_color_max" step="any" title="Highest value of the colour scale (empty: automatic, the grey value; Enter applies)">
        <label for="fs_colorbar">Colour bar</label>
        <select id="fs_colorbar" class="wide" title="Where the colour bar is drawn">
          <option value="bottom_right">Bottom right</option><option value="bottom_left">Bottom left</option>
          <option value="top_right">Top right</option><option value="top_left">Top left</option>
          <option value="right">Right side</option><option value="left">Left side</option>
          <option value="top">Top</option><option value="bottom">Bottom</option><option value="off">Off</option></select>
        <label for="fs_colorbar_length">Bar length</label>
        <input type="number" id="fs_colorbar_length" class="wide" min="0.1" max="1" step="0.05" placeholder="auto" title="Length of the colour bar as a fraction of the view, 0.1 - 1 (empty: automatic; applied as typed)">
        <h2 id="fs_axishead">Axis limits</h2>
        <label for="fs_x_min">x min / max</label>
        <input type="number" id="fs_x_min" step="any" title="Empty: automatic, the grey value; Enter applies"><input type="number" id="fs_x_max" step="any" title="Empty: automatic, the grey value; Enter applies">
        <label for="fs_y_min">y min / max</label>
        <input type="number" id="fs_y_min" step="any" title="Empty: automatic, the grey value; Enter applies"><input type="number" id="fs_y_max" step="any" title="Empty: automatic, the grey value; Enter applies">
        <label for="fs_z_min">z min / max</label>
        <input type="number" id="fs_z_min" step="any" title="Empty: automatic, the grey value; Enter applies"><input type="number" id="fs_z_max" step="any" title="Empty: automatic, the grey value; Enter applies">
        <label for="fs_horizontal_axis" id="fs_sidelabel">Axis labels</label>
        <select id="fs_horizontal_axis" title="Side of the horizontal axis' ticks and title (a map seen face-on)">
          <option value="bottom">Bottom</option><option value="top">Top</option></select>
        <select id="fs_vertical_axis" title="Side of the vertical axis' ticks and title (a map seen face-on)">
          <option value="left">Left</option><option value="right">Right</option></select>
        <h2 id="fs_scalehead">Scale bar</h2>
        <label for="fs_scale_bar" id="fs_scalelabel">Show / length</label>
        <select id="fs_scale_bar" title="A bar of a round length on the map, in place of the axes (a map seen face-on; the Axes button brings the axes back beside it). Drag it to move it, double-click it to put it back">
          <option value="off">Off</option><option value="on">On</option></select>
        <input type="number" id="fs_scale_bar_length" step="any" min="0" placeholder="auto" title="Length of the scale bar (empty: a round length near a fifth of the view, following the zoom; Enter applies)">
        <label for="fs_scale_bar_color" id="fs_scalecolorlabel">Colour</label>
        <select id="fs_scale_bar_color" class="wide" title="Colour of the scale bar and its length">
          <option value="auto">As the texts</option><option value="white">White</option><option value="black">Black</option></select>
        <h2 id="fs_legendhead">Material legend</h2>
        <label for="fs_legend_color" id="fs_legendlabel">Text colour</label>
        <select id="fs_legend_color" class="wide" title="Colour of the material names (the legend can be dragged over the field)">
          <option value="auto">As the texts</option><option value="white">White</option><option value="black">Black</option></select>
        <h2>Export</h2>
        <label for="fs_background">Background</label>
        <select id="fs_background" class="wide" title="Background of the view and of the saved picture">
          <option value="theme">As the theme</option><option value="white">White</option></select>
        <label for="fs_export_scale">PNG size</label>
        <select id="fs_export_scale" class="wide" title="Pixels of the saved PNG per pixel of the view (texts and lines scale with it)">
          <option value="1">As shown</option><option value="2">2 ×</option><option value="4">4 ×</option></select>
        <textarea id="fs_text" readonly title="The changed settings, as Results.export_html(figure=...) takes them (lengths in m)"></textarea>
        <div class="buttons"><button id="fs_reset" title="Back to the settings this page was written with">Reset</button>
          <button id="fs_copy" title="Copy the settings above for Results.export_html(figure=...)">Copy settings</button></div>
      </div>
    </div>
  </section>
  <div class="controls">
    <div class="group" id="framegroup">
      <button class="icon" id="prev" title="Previous frame (Left)">&#8592;</button>
      <button class="primary" id="play" title="Play / pause (Space)">Play</button>
      <button class="icon" id="next" title="Next frame (Right)">&#8594;</button>
      <input type="range" id="frame" min="0" max="0" step="1" value="0" aria-label="Frame">
      <span class="val num" id="framev"></span>
    </div>
    <div class="group" id="speedgroup"><label for="speed">Speed</label>
      <input type="range" id="speed" min="1" max="30" step="1" value="8"><span class="val num" id="speedv"></span></div>
    <div class="group"><label for="cmap">Colour</label>
      <select id="cmap" title="Colour map (diverging for signed fields)"></select>
      <select id="scale" title="Colour limits: over every frame, or of the shown frame">
        <option value="all">All frames</option><option value="frame">This frame</option></select>
      <button id="log" aria-pressed="false" title="Logarithmic colour scale (non-negative fields)">Log</button>
      <select id="decades" title="Decades shown on the log scale">
        <option value="2">2 dec</option><option value="3" selected>3 dec</option><option value="4">4 dec</option></select>
    </div>
    <div class="group"><label for="range">Range</label>
      <input type="range" id="range" min="0.02" max="1" step="0.01" value="1" title="Colour limit as a fraction of the largest value (saturates hot spots)">
      <span class="val num" id="rangev"></span></div>
    <div class="group" id="reliefgroup"><label for="relief">Relief</label>
      <input type="range" id="relief" min="0" max="1" step="0.01" value="0" title="Raise the map by its value">
      <span class="val num" id="reliefv"></span></div>
    <div class="group" id="volgroup" hidden><label for="volmode">View</label>
      <select id="volmode" title="How the whole 3D field is drawn: its cut planes, movable slices through it, a lit isosurface, nested see-through shells or a glowing cloud (V)"></select>
      <label for="vollevel" id="vollevellabel">Level</label>
      <input type="range" id="vollevel" min="0.02" max="0.98" step="0.01" value="0.5">
      <span class="val num" id="vollevelv"></span>
      <span class="group" id="slicegroup"></span></div>
    <div class="group" id="layergroup"></div>
    <div class="group" id="geomgroup"><label for="geom">Objects</label>
      <select id="geom" title="Model objects drawn with the field (G)"></select>
      <select id="geomcolor" title="Colour of the object outlines (Material: each outline is drawn just inside its own object, so both colours show where two objects meet)">
        <option value="auto">Contrast</option><option value="white">White</option><option value="black">Black</option>
        <option value="material">Material</option></select></div>
    <div class="group"><button id="mirror" aria-pressed="true">Mirror</button>
      <button id="lines" aria-pressed="false" title="Lines between the samples: the display grid or triangles, not necessarily the solver mesh (L)">Mesh</button>
      <button id="box" aria-pressed="true" title="Outline of the cut planes' box (B)">Box</button>
      <button id="axesbtn" aria-pressed="true" title="Coordinate axes with ticks (A)">Axes</button>
      <button id="stretch" aria-pressed="true">Stretch</button>
      <button id="spin" aria-pressed="false" title="Turn the view (S)">Spin</button></div>
    <div class="spacer"></div>
    <div class="group">
      <button id="settingsbtn" aria-pressed="false">Plot settings</button>
      <button id="png" title="Save the view as PNG">PNG</button>
      <button id="record" title="Record the view as video (frames when playing, else one turn)">Record</button>
      <button id="present" title="Presentation mode (P)">Present</button>
      <button id="theme" title="Light / dark">Theme</button>
    </div>
  </div>
</div>
<script id="field-data" type="application/json">/*__FIELD_DATA__*/null</script>
<script>
'use strict';
(function () {
const DATA = JSON.parse(document.getElementById('field-data').textContent);
const $ = (id) => document.getElementById(id);

// ---------- small helpers ----------
function store(key, value) { try { if (value === undefined) return localStorage.getItem('field_viewer.' + key);
  localStorage.setItem('field_viewer.' + key, value); } catch (e) { return null; } return null; }
function b64bytes(text) { const bin = atob(text); const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out.buffer; }
function f32(text) { return new Float32Array(b64bytes(text)); }
function u32(text) { return new Uint32Array(b64bytes(text)); }
function i16(text) { return new Int16Array(b64bytes(text)); }
function hexRgb(h) { return [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255]; }
function niceUnit(u) { return (u || '').replace(/^u(?=[a-zA-Z])/, 'µ'); }
const PREFIXES = [[1e12, 'T'], [1e9, 'G'], [1e6, 'M'], [1e3, 'k'], [1, ''], [1e-3, 'm'], [1e-6, 'µ'], [1e-9, 'n'], [1e-12, 'p']];
function prefixable(unit) {
  // no SI prefix on units that start with one (kg, mT, mol), whose first factor has a power (m^2) or that take
  // none (a.u., dB, deg, rad, %)
  return !!unit && !/^[TGMkmµunp][A-Za-z]/.test(unit) && !/^[^/]*(\^|²|³)/.test(unit) && !/^(a\.u\.|1|dB|deg|rad|%)$/.test(unit);
}
function fmtValue(v, unit) {
  // a value with an SI prefix on a plain unit (V/m -> kV/m), else scientific
  if (!isFinite(v)) return '–';
  if (v === 0) return '0' + (unit ? ' ' + unit : '');
  const a = Math.abs(v);
  if (prefixable(unit) && a >= 1e-12 && a < 1e15) {
    for (const [s, p] of PREFIXES) if (a >= s) return Number((v / s).toPrecision(3)) + ' ' + p + unit;
  }
  const t = (a >= 1e-2 && a < 1e4) ? Number(v.toPrecision(3)).toString() : v.toExponential(1).replace('e+', 'e');
  return t + (unit ? ' ' + unit : '');
}
function superscript(n) { return String(n).replace(/[-0-9]/g, (ch) => '⁻⁰¹²³⁴⁵⁶⁷⁸⁹'['-0123456789'.indexOf(ch)]); }
function barScale(lo, hi, unit) {
  // one factor for every tick label of the colour bar, named with the unit: an SI prefix on a plain unit (MPa),
  // else a power of 1000 (×10⁻⁶ m^2)
  const a = Math.max(Math.abs(lo), Math.abs(hi));
  if (!(a > 0) || !isFinite(a)) return { factor: 1, unit: unit || '' };
  if (prefixable(unit) && a >= 1e-12 && a < 1e15) for (const [s, p] of PREFIXES) if (a >= s) return { factor: s, unit: p + unit };
  if (a >= 1e-2 && a < 1e4) return { factor: 1, unit: unit || '' };
  const e = 3 * Math.floor(Math.log10(a) / 3);
  return { factor: Math.pow(10, e), unit: '×10' + superscript(e) + (unit ? ' ' + unit : '') };
}

// 9 stops each; sequential maps for magnitudes, diverging maps for signed fields (the middle stop at 0)
const CMAPS = {
  viridis: ['#440154', '#472d7b', '#3b528b', '#2c728e', '#21918c', '#28ae80', '#5ec962', '#addc30', '#fde725'],
  inferno: ['#000004', '#1f0c48', '#550f6d', '#88226a', '#ba3655', '#e35933', '#f98e09', '#f8c931', '#fcffa4'],
  ice: ['#04051a', '#151a4b', '#1d3a7a', '#1f5f9e', '#2a86b5', '#4fabc4', '#86ccd3', '#c2e7e6', '#f4fbfb'],
  coolwarm: ['#3b4cc0', '#6282ea', '#8db0fe', '#b8d0f9', '#dddcdc', '#f5c4ad', '#f49a7b', '#de604d', '#b40426'],
  rdbu: ['#2166ac', '#4393c3', '#92c5de', '#d1e5f0', '#f7f7f7', '#fddbc7', '#f4a582', '#d6604d', '#b2182b'],
  puor: ['#542788', '#8073ac', '#b2abd2', '#d8daeb', '#f7f7f7', '#fee0b6', '#fdb863', '#e08214', '#b35806'],
  icefire: ['#9be4ff', '#3fa9e6', '#2563b8', '#1b2a5e', '#141414', '#5e1b1b', '#b83a25', '#e6823f', '#ffd59b'],
};
const CMAP_CHOICES = {
  sequential: [['viridis', 'Viridis'], ['inferno', 'Inferno'], ['ice', 'Ice']],
  diverging: [['coolwarm', 'Cool–warm'], ['rdbu', 'Blue–red'], ['puor', 'Purple–orange'], ['icefire', 'Ice–fire (dark middle)']],
};

// ---------- data ----------
if (!DATA) { $('empty').hidden = false; $('empty').textContent = 'No field data in this file.'; return; }
document.title = DATA.title || 'Field viewer';
$('title').textContent = DATA.title || 'Field viewer';
$('subtitle').textContent = DATA.subtitle || '';
const Q = DATA.quantity;
const SIGNED = !!Q.signed;
const FRAMES = DATA.frames;
const NF = FRAMES.length;
const KIND = DATA.frame_kind;              // 'time' | 'labelled' | 'single'
const is2d = DATA.dimensions === 2;
const lengthUnit = niceUnit(DATA.length_unit || 'm');
const AX = { x: 0, y: 1, z: 2 };
const LOG_OK = !SIGNED && DATA.range[1] > 0 && DATA.range[0] >= 0;

// ---------- plot settings (the Plot settings panel; keys and values as viz.field_viewer.figure_settings) ----------
// fig: lengths in m, colour limits in the field's unit, null = automatic. Start: the defaults, then what this browser
// remembers (the style for every page; the limits for this file and field, so a rewritten page of the same model
// keeps them), then DATA.figure (Results.export_html(figure=...))
const LENGTH_SCALE = DATA.length_scale || 1;   // m per length unit of the page

  $('spin').setAttribute('aria-pressed', String(state.spin));
  $('present').setAttribute('aria-pressed', String(document.body.classList.contains('present')));
  $('settingsbtn').setAttribute('aria-pressed', String(!$('settings').hidden));
  for (const L of LAYERS) if (L.button) L.button.setAttribute('aria-pressed', String(L.visible));
}
function select(f) { state.frame = ((f % NF) + NF) % NF; uploadFrame(); updateReadout(); syncControls(); }
$('framegroup').style.display = NF > 1 ? '' : 'none';
$('play').style.display = KIND === 'time' ? '' : 'none';
$('speedgroup').style.display = KIND === 'time' ? '' : 'none';
$('scale').style.display = NF > 1 ? '' : 'none';
$('scale').value = state.scale;
$('log').style.display = LOG_OK ? '' : 'none';
$('reliefgroup').style.display = PLANAR ? '' : 'none';
$('box').style.display = PLANAR ? 'none' : '';
$('mirror').style.display = CAN_MIRROR ? '' : 'none';
$('mirror').title = 'Mirror images across the symmetry planes: the whole structure, not only the simulated part ('
  + MIRRORS.map((M) => M.face + (M.sign < 0 ? (Q.phase ? ': phase + π' : ': field × −1') : '')).join(', ') + ') (M)';
$('lines').disabled = !LAYERS.some((L) => L.edges);
if ($('lines').disabled) $('lines').title = 'Mesh lines (too many cells to draw them)';
$('frame').max = String(Math.max(NF - 1, 0));
if (LAYERS.length > 1) {
  for (const L of LAYERS) {
    const b = document.createElement('button'); b.textContent = L.name || 'layer ' + (L.index + 1);
    b.title = 'Show / hide this cut plane';
    b.onclick = () => { L.visible = !L.visible; if (!LAYERS.some((x) => x.visible) && !volumeShown()) L.visible = true; updateReadout(); syncControls(); };
    L.button = b; $('layergroup').appendChild(b);
  }
} else $('layergroup').style.display = 'none';
$('play').onclick = () => { state.playing = !state.playing; syncControls(); };
$('prev').onclick = () => { state.playing = false; select(state.frame - 1); };
$('next').onclick = () => { state.playing = false; select(state.frame + 1); };
$('frame').oninput = (e) => { state.playing = false; select(+e.target.value); };
$('speed').oninput = (e) => { state.fps = +e.target.value; syncControls(); };
$('cmap').onchange = (e) => { state.cmap = e.target.value; store(SIGNED ? 'cmap_signed' : 'cmap', state.cmap); updateReadout(); };
$('scale').onchange = (e) => { state.scale = e.target.value; updateReadout(); };
$('log').onclick = () => { state.log = !state.log; updateReadout(); syncControls(); };
$('decades').onchange = (e) => { state.decades = +e.target.value; updateReadout(); };
$('range').oninput = (e) => { state.range = +e.target.value; updateReadout(); syncControls(); };
$('relief').oninput = (e) => { const was = state.relief; state.relief = +e.target.value;
  if (was === 0 && state.relief > 0 && faceOn()) { cam.el = NORMAL === 2 ? 0.75 : 0.6; cam.target = [0, 0, 0]; }   // tilt so the relief shows
  fitDistance(); syncControls(); };
$('lines').onclick = () => { state.lines = !state.lines; syncControls(); };
$('box').onclick = () => { state.box = !state.box; syncControls(); };
$('axesbtn').onclick = () => { state.axes = !state.axes; syncControls(); };
$('stretch').onclick = () => { state.stretch = !state.stretch; fitDistance(); updateReadout(); syncControls(); };
$('mirror').onclick = () => { state.mirror = !state.mirror; setBounds(state.mirror); writeBox(); cam.target = [0, 0, 0];
  fitDistance(); updateReadout(); syncControls(); syncSettings(); };
$('spin').onclick = () => { state.spin = !state.spin; syncControls(); };
$('present').onclick = () => { document.body.classList.toggle('present'); syncControls(); setTimeout(() => { resize(); fitDistance(); }, 0); };
$('theme').onclick = () => {
  const dark = getComputedStyle(document.documentElement).colorScheme === 'dark';
  document.documentElement.dataset.theme = dark ? 'light' : 'dark'; store('theme', document.documentElement.dataset.theme);
  readTheme();
};
function fileStem() { return (DATA.title || 'field').replace(/[^\w.-]+/g, '_').slice(0, 60); }
function download(href, name) { const a = document.createElement('a'); a.href = href; a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); }
$('png').onclick = () => {
  // one draw at the Plot settings PNG size (the canvases take that many pixels for it), then back to the screen's
  renderScale = fig.export_scale; draw();
  const url = composite(document.createElement('canvas')).toDataURL('image/png');
  renderScale = 1; draw();
  download(url, fileStem() + '.png');
};
let recorder = null, recordCanvas = null;   // recordings capture the composite (view + axes), refreshed after each draw
$('record').onclick = () => {
  if (recorder) { recorder.stop(); return; }
  recordCanvas = document.createElement('canvas');
  if (!recordCanvas.captureStream || !window.MediaRecorder) { recordCanvas = null; alert('This browser cannot record the canvas.'); return; }
  const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const type = types.find((t) => MediaRecorder.isTypeSupported(t)) || '';
  const chunks = [];
  draw(); composite(recordCanvas);
  recorder = new MediaRecorder(recordCanvas.captureStream(60), type ? { mimeType: type, videoBitsPerSecond: 16e6 } : {});
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
    download(URL.createObjectURL(blob), fileStem() + (blob.type.includes('mp4') ? '.mp4' : '.webm'));
    recorder = null; recordCanvas = null; $('rec').classList.remove('on'); $('record').textContent = 'Record';
    state.spin = spinBefore; syncControls();
  };
  const spinBefore = state.spin;
  // time frames: one pass from the first frame; otherwise one full turn of the view
  let seconds;
  if (KIND === 'time') { select(0); state.playing = true; seconds = NF / state.fps; }
  else { state.spin = true; seconds = 2 * Math.PI / SPIN_RATE; }
  syncControls();
  recorder.start(); $('rec').classList.add('on'); $('record').textContent = 'Stop';
  setTimeout(() => { if (recorder) recorder.stop(); }, 1000 * seconds + 150);
};
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;   // browser shortcuts (copy, select all) are not view keys
  const k = e.key;
  if (k === ' ' && KIND === 'time') { $('play').click(); e.preventDefault(); }
  else if (k === 'ArrowLeft' && NF > 1) { $('prev').click(); e.preventDefault(); }
  else if (k === 'ArrowRight' && NF > 1) { $('next').click(); e.preventDefault(); }
  else if (k === 'p' || k === 'P') $('present').click();
  else if (k === 'f' || k === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
  else if ((k === 'l' || k === 'L') && !$('lines').disabled) $('lines').click();
  else if ((k === 'b' || k === 'B') && !PLANAR) $('box').click();
  else if (k === 'a' || k === 'A') $('axesbtn').click();
  else if ((k === 't' || k === 'T') && CAN_STRETCH) $('stretch').click();
  else if ((k === 'm' || k === 'M') && CAN_MIRROR) $('mirror').click();
  else if (k === 's' || k === 'S') $('spin').click();
});

// ---------- pointer: orbit, pan, zoom ----------
const pointers = new Map(); let pinch = 0;
let partDrag = null;                         // { part, id, x, y (last client px) } while a movable overlay part is dragged
function partUnder(e) {
  // the movable overlay part (MOVABLE) under the pointer, or null: the overlay canvas takes no pointer input itself
  const r = canvas.getBoundingClientRect(), reach = 4 * pixelRatio;
  const x = (e.clientX - r.left) * canvas.width / Math.max(r.width, 1), y = (e.clientY - r.top) * canvas.height / Math.max(r.height, 1);
  return Object.values(MOVABLE).find((P) => P.box && x >= P.box[0] - reach && x <= P.box[2] + reach
                                                  && y >= P.box[1] - reach && y <= P.box[3] + reach) || null;
}
function endPartDrag(e) {
  if (!partDrag || partDrag.id !== e.pointerId) return;
  store(partDrag.part.storeKey, JSON.stringify(partDrag.part.offset)); partDrag = null;
}
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  const part = e.button === 0 && !partDrag ? partUnder(e) : null;
  if (part) { partDrag = { part, id: e.pointerId, x: e.clientX, y: e.clientY }; return; }
  pointers.set(e.pointerId, [e.clientX, e.clientY, e.shiftKey || e.button === 2]);
});
canvas.addEventListener('pointerup', (e) => { endPartDrag(e); pointers.delete(e.pointerId); pinch = 0; });
canvas.addEventListener('pointercancel', (e) => { endPartDrag(e); pointers.delete(e.pointerId); pinch = 0; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('pointermove', (e) => {
  if (partDrag && partDrag.id === e.pointerId) {
    const P = partDrag.part;
    P.offset = [P.offset[0] + e.clientX - partDrag.x, P.offset[1] + e.clientY - partDrag.y];
    partDrag.x = e.clientX; partDrag.y = e.clientY;
    return;
  }
  if (!pointers.has(e.pointerId)) { canvas.style.cursor = partUnder(e) ? 'move' : ''; return; }
  const [px, py, pan] = pointers.get(e.pointerId); const dx = e.clientX - px, dy = e.clientY - py;
  pointers.set(e.pointerId, [e.clientX, e.clientY, pan]);
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch && mapNavigable()) zoomMap(pinch / d, { clientX: 0.5 * (a[0] + b[0]), clientY: 0.5 * (a[1] + b[1]) });
    else if (pinch) { cam.dist *= pinch / d; cam.moved = true; }
    pinch = d; return;
  }
  if (pan && mapNavigable()) {
    panMap({ clientX: px, clientY: py }, e);   // the frame stays; the map moves inside it
  } else if (pan) {
    const { s, u } = cameraAxes();
    const k = cam.dist * 0.0018;
    cam.target = cam.target.map((t, i) => t - (s[i] * dx - u[i] * dy) * k); cam.moved = true;
  } else {
    cam.az -= dx * 0.008; cam.el = Math.max(-1.55, Math.min(1.56, cam.el + dy * 0.008));
  }
});
canvas.addEventListener('wheel', (e) => {
  // a face-on map zooms its axis limits about the pointer (the frame keeps its size), any other view the camera
  e.preventDefault();
  if (mapNavigable()) zoomMap(Math.exp(e.deltaY * 0.0012), e);
  else { cam.dist *= Math.exp(e.deltaY * 0.0012); cam.moved = true; }
}, { passive: false });
canvas.addEventListener('dblclick', (e) => {
  // on a movable part: that part back to its home place; on a face-on map: automatic limits and full size; else the view
  const part = partUnder(e);
  if (part) homePart(part);
  else if (mapNavigable()) { resetMapLimits(); resetCamera(); }
  else resetCamera();
});

// ---------- loop ----------
const SPIN_RATE = 2 * Math.PI / 12;          // one turn in 12 s
let last = performance.now(), frameClock = 0;
function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  introTurn(dt); adaptVolume(dt);
  if (state.spin) cam.az -= SPIN_RATE * dt;
  if (state.playing && NF > 1) {
    frameClock += dt * state.fps;
    if (frameClock >= 1) { const steps = Math.floor(frameClock); frameClock -= steps; select(state.frame + steps); }
  }
  draw();
  if (recordCanvas) composite(recordCanvas);
  requestAnimationFrame(tick);
}
readTheme();
const mq = window.matchMedia('(prefers-color-scheme: dark)');
if (mq.addEventListener) mq.addEventListener('change', () => readTheme());
window.addEventListener('resize', () => { resize(); });
if (gl) { try { setupGL(); } catch (err) { $('empty').hidden = false; $('empty').textContent = 'WebGL error: ' + err.message; } }
resize(); resetCamera(); syncControls(); syncSettings(); select(0);
window.fieldViewer = { state, select, draw, cam, limits, figure: fig };
requestAnimationFrame(tick);
})();
</script>
