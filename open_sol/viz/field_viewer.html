<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field viewer</title>
<!-- open_sol field viewer: one self-contained page (no network). viz/field_viewer.py fills the data block below.
     The camera, colour maps, theme, PNG and recording blocks follow viz/mode_player.html: keep the two in step. -->
<style>
:root {
  --bg: #f4f5f7;
  --panel: #ffffff;
  --panel-2: #f8f9fb;
  --ink: #16181d;
  --ink-2: #4a5160;
  --ink-3: #7c8494;
  --rule: #e2e5eb;
  --accent: #2f6fdf;
  --accent-ink: #ffffff;
  --view-top: #ffffff;
  --view-bottom: #e9ecf2;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 8px 24px rgba(16, 24, 40, 0.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f13;
    --panel: #151820;
    --panel-2: #1a1e27;
    --ink: #eef0f4;
    --ink-2: #b4bac6;
    --ink-3: #7d8594;
    --rule: #262b36;
    --accent: #6ea0ff;
    --accent-ink: #0b0d12;
    --view-top: #1b1f29;
    --view-bottom: #0f1117;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f13;
  --panel: #151820;
  --panel-2: #1a1e27;
  --ink: #eef0f4;
  --ink-2: #b4bac6;
  --ink-3: #7d8594;
  --rule: #262b36;
  --accent: #6ea0ff;
  --accent-ink: #0b0d12;
  --view-top: #1b1f29;
  --view-bottom: #0f1117;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.num { font-variant-numeric: tabular-nums; }
.app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; gap: 12px; padding: 16px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
header h1 { font-size: 18px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
header p { margin: 2px 0 0; color: var(--ink-3); font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow);
        min-height: 0; position: relative; overflow: hidden; }
.view { background: linear-gradient(180deg, var(--view-top), var(--view-bottom)); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl:active { cursor: grabbing; }
.readout { position: absolute; left: 18px; top: 14px; pointer-events: none; }
.readout .f { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15; }
.readout .m { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.legend { position: absolute; right: 18px; bottom: 16px; width: 200px; pointer-events: none; font-size: 11px;
          color: var(--ink-3); }
.legend .bar { height: 8px; border-radius: 4px; margin-bottom: 3px; }
.legend .ticks { display: flex; justify-content: space-between; gap: 6px; }
.legend .name { color: var(--ink-2); margin-bottom: 4px; }
.hint { position: absolute; left: 18px; bottom: 14px; font-size: 11px; color: var(--ink-3); pointer-events: none; }
.rec { position: absolute; right: 18px; top: 16px; display: none; align-items: center; gap: 6px; font-size: 12px;
       font-weight: 600; color: #e5484d; }
.rec::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #e5484d; }
.rec.on { display: flex; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; background: var(--panel);
            border: 1px solid var(--rule); border-radius: 12px; padding: 10px 14px; box-shadow: var(--shadow); }
.group { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
.group label { white-space: nowrap; }
button, select { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel-2);
                 border: 1px solid var(--rule); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
button:hover, select:hover { border-color: var(--ink-3); }
button:disabled, select:disabled { opacity: 0.45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); min-width: 76px;
                 font-weight: 600; }
button.icon { padding: 5px 8px; min-width: 32px; }
button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
input[type="range"] { width: 110px; accent-color: var(--accent); }
input#frame { width: 180px; }
.val { min-width: 42px; color: var(--ink); }
.spacer { flex: 1; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); text-align: center;
         padding: 24px; }
.empty[hidden] { display: none; }   /* the author display above would beat [hidden]: the empty overlay must not
                                      cover the canvas and take its pointer input */
body.present .controls, body.present header p, body.present .hint { display: none; }
body.present .app { padding: 10px; gap: 10px; }
@media (max-width: 820px) {
  .app { height: auto; min-height: 100vh; }
  .view { aspect-ratio: 4 / 3; }
  .readout .f { font-size: 20px; }
  .legend { width: 140px; }
  .legend .name { display: none; }
  .hint { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1 id="title">Field viewer</h1>
      <p id="subtitle"></p>
    </div>
  </header>
  <section class="card view" aria-label="Field">
    <canvas id="gl"></canvas>
    <div class="readout"><div class="f num" id="rf"></div><div class="m num" id="rm"></div></div>
    <div class="legend" id="legend"><div class="name" id="lgname"></div><div class="bar" id="lgbar"></div>
      <div class="ticks num"><span id="lglo"></span><span id="lgmid"></span><span id="lghi"></span></div></div>
    <div class="hint">Drag to rotate · Shift-drag to pan · Scroll to zoom · Double-click to reset</div>
    <div class="rec" id="rec">REC</div>
    <div class="empty" id="empty" hidden></div>
  </section>
  <div class="controls">
    <div class="group" id="framegroup">
      <button class="icon" id="prev" title="Previous frame (Left)">&#8592;</button>
      <button class="primary" id="play" title="Play / pause (Space)">Play</button>
      <button class="icon" id="next" title="Next frame (Right)">&#8594;</button>
      <input type="range" id="frame" min="0" max="0" step="1" value="0" aria-label="Frame">
      <span class="val num" id="framev"></span>
    </div>
    <div class="group" id="speedgroup"><label for="speed">Speed</label>
      <input type="range" id="speed" min="1" max="30" step="1" value="8"><span class="val num" id="speedv"></span></div>
    <div class="group"><label for="cmap">Colour</label>
      <select id="cmap" title="Colour map (diverging for signed fields)"></select>
      <select id="scale" title="Colour limits: over every frame, or of the shown frame">
        <option value="all">All frames</option><option value="frame">This frame</option></select>
      <button id="log" aria-pressed="false" title="Logarithmic colour scale (non-negative fields)">Log</button>
      <select id="decades" title="Decades shown on the log scale">
        <option value="2">2 dec</option><option value="3" selected>3 dec</option><option value="4">4 dec</option></select>
    </div>
    <div class="group"><label for="range">Range</label>
      <input type="range" id="range" min="0.02" max="1" step="0.01" value="1" title="Colour limit as a fraction of the largest value (saturates hot spots)">
      <span class="val num" id="rangev"></span></div>
    <div class="group" id="reliefgroup"><label for="relief">Relief</label>
      <input type="range" id="relief" min="0" max="1" step="0.01" value="0" title="Raise the map by its value">
      <span class="val num" id="reliefv"></span></div>
    <div class="group" id="layergroup"></div>
    <div class="group"><button id="lines" aria-pressed="false" title="Lines between the samples: the display grid or triangles, not necessarily the solver mesh (L)">Mesh</button>
      <button id="box" aria-pressed="true" title="Outline of the cut planes' box (B)">Box</button>
      <button id="spin" aria-pressed="false" title="Turn the view (S)">Spin</button></div>
    <div class="spacer"></div>
    <div class="group">
      <button id="png" title="Save the view as PNG">PNG</button>
      <button id="record" title="Record the view as video (frames when playing, else one turn)">Record</button>
      <button id="present" title="Presentation mode (P)">Present</button>
      <button id="theme" title="Light / dark">Theme</button>
    </div>
  </div>
</div>
<script id="field-data" type="application/json">/*__FIELD_DATA__*/null</script>
<script>
'use strict';
(function () {
const DATA = JSON.parse(document.getElementById('field-data').textContent);
const $ = (id) => document.getElementById(id);

// ---------- small helpers ----------
function store(key, value) { try { if (value === undefined) return localStorage.getItem('field_viewer.' + key);
  localStorage.setItem('field_viewer.' + key, value); } catch (e) { return null; } return null; }
function b64bytes(text) { const bin = atob(text); const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out.buffer; }
function f32(text) { return new Float32Array(b64bytes(text)); }
function u32(text) { return new Uint32Array(b64bytes(text)); }
function i16(text) { return new Int16Array(b64bytes(text)); }
function hexRgb(h) { return [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255]; }
function niceUnit(u) { return (u || '').replace(/^u(?=[a-zA-Z])/, 'µ'); }
const PREFIXES = [[1e12, 'T'], [1e9, 'G'], [1e6, 'M'], [1e3, 'k'], [1, ''], [1e-3, 'm'], [1e-6, 'µ'], [1e-9, 'n'], [1e-12, 'p']];
function fmtValue(v, unit) {
  // a value with an SI prefix on a plain unit (V/m -> kV/m), else scientific
  if (!isFinite(v)) return '–';
  if (v === 0) return '0' + (unit ? ' ' + unit : '');
  const a = Math.abs(v);
  // no prefix on units that start with one (kg, mT, mol), whose first factor has a power (m^2) or that take
  // none (a.u., dB, deg, rad, %)
  if (unit && !/^[TGMkmµunp][A-Za-z]/.test(unit) && !/^[^/]*(\^|²|³)/.test(unit) && !/^(a\.u\.|1|dB|deg|rad|%)$/.test(unit) && a >= 1e-12 && a < 1e15) {
    for (const [s, p] of PREFIXES) if (a >= s) return Number((v / s).toPrecision(3)) + ' ' + p + unit;
  }
  const t = (a >= 1e-2 && a < 1e4) ? Number(v.toPrecision(3)).toString() : v.toExponential(1).replace('e+', 'e');
  return t + (unit ? ' ' + unit : '');
}

// 9 stops each; sequential maps for magnitudes, diverging maps for signed fields (the middle stop at 0)
const CMAPS = {
  viridis: ['#440154', '#472d7b', '#3b528b', '#2c728e', '#21918c', '#28ae80', '#5ec962', '#addc30', '#fde725'],
  inferno: ['#000004', '#1f0c48', '#550f6d', '#88226a', '#ba3655', '#e35933', '#f98e09', '#f8c931', '#fcffa4'],
  ice: ['#04051a', '#151a4b', '#1d3a7a', '#1f5f9e', '#2a86b5', '#4fabc4', '#86ccd3', '#c2e7e6', '#f4fbfb'],
  coolwarm: ['#3b4cc0', '#6282ea', '#8db0fe', '#b8d0f9', '#dddcdc', '#f5c4ad', '#f49a7b', '#de604d', '#b40426'],
  rdbu: ['#2166ac', '#4393c3', '#92c5de', '#d1e5f0', '#f7f7f7', '#fddbc7', '#f4a582', '#d6604d', '#b2182b'],
  puor: ['#542788', '#8073ac', '#b2abd2', '#d8daeb', '#f7f7f7', '#fee0b6', '#fdb863', '#e08214', '#b35806'],
  icefire: ['#9be4ff', '#3fa9e6', '#2563b8', '#1b2a5e', '#141414', '#5e1b1b', '#b83a25', '#e6823f', '#ffd59b'],
};
const CMAP_CHOICES = {
  sequential: [['viridis', 'Viridis'], ['inferno', 'Inferno'], ['ice', 'Ice']],
  diverging: [['coolwarm', 'Cool–warm'], ['rdbu', 'Blue–red'], ['puor', 'Purple–orange'], ['icefire', 'Ice–fire (dark middle)']],
};

// ---------- data ----------
if (!DATA) { $('empty').hidden = false; $('empty').textContent = 'No field data in this file.'; return; }
document.title = DATA.title || 'Field viewer';
$('title').textContent = DATA.title || 'Field viewer';
$('subtitle').textContent = DATA.subtitle || '';
const Q = DATA.quantity;
const SIGNED = !!Q.signed;
const FRAMES = DATA.frames;
const NF = FRAMES.length;
const KIND = DATA.frame_kind;              // 'time' | 'labelled' | 'single'
const is2d = DATA.dimensions === 2;
const lengthUnit = niceUnit(DATA.length_unit || 'm');
const AX = { x: 0, y: 1, z: 2 };
const LOG_OK = !SIGNED && DATA.range[1] > 0 && DATA.range[0] >= 0;

// layer geometry: positions (n, 3) in length units, triangles, optional edges for mesh lines
const LAYERS = DATA.layers.map((L, index) => {
  const iu = AX[L.axes[0]], iv = AX[L.axes[1]], iw = L.normal ? AX[L.normal] : 2, w = L.position || 0;
  let pos, tri, edges = null, n;
  if (L.kind === 'grid') {
    const u = f32(L.u), v = f32(L.v), nu = L.nu, nv = L.nv; n = nu * nv;
    pos = new Float32Array(3 * n);
    for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) {
      const o = 3 * (i * nv + j); pos[o + iu] = u[i]; pos[o + iv] = v[j]; pos[o + iw] = w;
    }
    tri = new Uint32Array(Math.max(nu - 1, 0) * Math.max(nv - 1, 0) * 6); let t = 0;
    for (let i = 0; i + 1 < nu; i++) for (let j = 0; j + 1 < nv; j++) {
      const a = i * nv + j, b = a + nv, c = a + 1, d = b + 1;
      tri[t++] = a; tri[t++] = b; tri[t++] = d; tri[t++] = a; tri[t++] = d; tri[t++] = c;
    }
    if (n <= 90000) {
      const e = []; for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) {
        const a = i * nv + j; if (i + 1 < nu) e.push(a, a + nv); if (j + 1 < nv) e.push(a, a + 1); }
      edges = new Uint32Array(e);
    }
  } else {
    const nodes = f32(L.nodes); n = L.count; tri = u32(L.triangles);
    pos = new Float32Array(3 * n);
    for (let k = 0; k < n; k++) { pos[3 * k + iu] = nodes[2 * k]; pos[3 * k + iv] = nodes[2 * k + 1]; pos[3 * k + iw] = w; }
    if (tri.length <= 900000) {
      const seen = new Set(), e = [];
      for (let t = 0; t < tri.length; t += 3) for (let c = 0; c < 3; c++) {
        const a = tri[t + c], b = tri[t + (c + 1) % 3], lo = Math.min(a, b), hi = Math.max(a, b), key = lo * n + hi;
        if (!seen.has(key)) { seen.add(key); e.push(lo, hi); }
      }
      edges = new Uint32Array(e);
    }
  }
  const normal = [0, 0, 0]; normal[iw] = 1;
  return { index, name: L.name || '', n, pos, tri, edges, normal, visible: true };
});

const bmin = [Infinity, Infinity, Infinity], bmax = [-Infinity, -Infinity, -Infinity];
for (const L of LAYERS) for (let k = 0; k < L.n; k++) for (let c = 0; c < 3; c++) {
  const v = L.pos[3 * k + c]; if (v < bmin[c]) bmin[c] = v; if (v > bmax[c]) bmax[c] = v; }
const center = [0, 1, 2].map((c) => 0.5 * (bmin[c] + bmax[c]));
const sceneSize = Math.max(bmax[0] - bmin[0], bmax[1] - bmin[1], bmax[2] - bmin[2]) || 1;

// ---------- state ----------
const state = {
  // colour limits: shared over time frames; per frame for labelled ones (modes, wavelengths: independent states)
  frame: 0, playing: false, fps: 8, scale: KIND === 'time' ? 'all' : 'frame', log: false, decades: 3, range: 1, relief: 0,
  lines: false, box: !is2d, spin: false,
  cmap: (SIGNED ? store('cmap_signed') : store('cmap')) || (SIGNED ? 'coolwarm' : 'viridis'),
};
const choices = CMAP_CHOICES[SIGNED ? 'diverging' : 'sequential'];
if (!choices.some(([key]) => key === state.cmap)) state.cmap = choices[0][0];
$('cmap').replaceChildren(...choices.map(([key, label]) => new Option(label, key)));
$('cmap').value = state.cmap;
const savedTheme = store('theme');
if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;

// ---------- frames ----------
const frameCache = new Map();
function frameValues(f) {
  // per layer Float32Array (value, ok) pairs, decoded from the int16 codes over [lo, hi]
  if (frameCache.has(f)) return frameCache.get(f);
  // linear codes: lo + (q + 32767) (hi - lo) / 65534; log codes (frame log_lo set: non-negative fields reaching
  // down to ~0): 10^(log_lo + (q + 32767) (log10 hi - log_lo) / 65534), the lowest code = lo (at or below the floor)
  const F = FRAMES[f], step = (F.hi - F.lo) / 65534;
  const L0 = F.log_lo, LS = L0 != null ? (Math.log10(Math.max(F.hi, 1e-300)) - L0) / 65534 : 0;
  const out = F.values.map((text) => {
    const q = i16(text), a = new Float32Array(2 * q.length);
    for (let k = 0; k < q.length; k++) {
      const c = q[k];
      if (c === -32768) { a[2 * k] = 0; a[2 * k + 1] = 0; continue; }
      a[2 * k] = L0 == null ? F.lo + (c + 32767) * step : (c === -32767 ? F.lo : Math.pow(10, L0 + (c + 32767) * LS));
      a[2 * k + 1] = 1;
    }
    return a;
  });
  if (frameCache.size > 32) frameCache.delete(frameCache.keys().next().value);
  frameCache.set(f, out);
  return out;
}
function limits() {
  // shown colour limits [lo, hi] (log: hi and the decades below it)
  const F = FRAMES[state.frame];
  let lo = state.scale === 'frame' ? F.lo : DATA.range[0], hi = state.scale === 'frame' ? F.hi : DATA.range[1];
  if (SIGNED) { const m = Math.max(Math.abs(lo), Math.abs(hi)) * state.range || 1; return [-m, m]; }
  if (state.log && LOG_OK) { const top = Math.max(hi * state.range, 1e-300); return [top * Math.pow(10, -state.decades), top]; }
  hi = lo + (hi - lo) * state.range;
  if (!(hi > lo)) hi = lo + (Math.abs(lo) || 1);
  return [lo, hi];
}

// ---------- WebGL ----------
const canvas = $('gl');
const gl = canvas.getContext('webgl2', { antialias: true, alpha: false, preserveDrawingBuffer: false });
if (!gl) { $('empty').hidden = false; $('empty').textContent = 'This browser has no WebGL2: the field cannot be drawn.'; }

const VS = `#version 300 es
precision highp float;
precision highp int;
in vec3 aPos; in vec2 aVal;
uniform mat4 uView; uniform mat4 uProj; uniform vec3 uCenter;
uniform float uLo; uniform float uHi; uniform int uLog; uniform int uSigned;
uniform float uRelief; uniform vec3 uNormal;
out float vT; out float vOk; out vec3 vViewPos;
void main() {
  float v = aVal.x, t;
  if (uLog == 1) t = (log(max(v, 1e-37)) - log(uLo)) / (log(uHi) - log(uLo));
  else t = (v - uLo) / (uHi - uLo);
  t = clamp(t, 0.0, 1.0);
  float h = (uSigned == 1) ? 2.0 * t - 1.0 : t;
  vec3 p = aPos - uCenter + uNormal * (uRelief * h);
  vT = t; vOk = aVal.y;
  vec4 vp = uView * vec4(p, 1.0);
  vViewPos = vp.xyz;
  gl_Position = uProj * vp;
}`;
const FS = `#version 300 es
precision highp float;
precision highp int;
in float vT; in float vOk; in vec3 vViewPos;
uniform vec3 uStops[9]; uniform int uLine; uniform vec4 uLineColor; uniform float uShade;
out vec4 outColor;
vec3 cmap(float t) {
  t = clamp(t, 0.0, 1.0) * 8.0;
  int i = int(min(floor(t), 7.0));
  return mix(uStops[i], uStops[i + 1], t - float(i));
}
void main() {
  if (vOk < 0.999) discard;           // a triangle or edge touching a sample without value
  if (uLine == 1) { outColor = uLineColor; return; }
  vec3 base = cmap(vT);
  vec3 col = base;
  if (uShade > 0.0) {                 // relief: light the raised surface; flat maps keep the legend colours
    vec3 n = normalize(cross(dFdx(vViewPos), dFdy(vViewPos)));
    vec3 v = normalize(-vViewPos);
    vec3 key = normalize(vec3(0.45, 0.75, 0.55));
    float dk = abs(dot(n, key));
    float sp = pow(max(dot(n, normalize(key + v)), 0.0), 40.0);
    col = mix(base, base * (0.45 + 0.65 * dk) + vec3(0.16) * sp, uShade);
  }
  outColor = vec4(col, 1.0);
}`;

let prog = null, uni = {}, ready = false, boxVao = null, boxCount = 0;
function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function vertexBuffer(loc, data, size, usage) { const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, data, usage); if (loc >= 0) { gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0); } return b; }
function indexBuffer(data) { const b = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, b);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, data, gl.STATIC_DRAW); return b; }
function setupGL() {
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  for (const name of ['uView', 'uProj', 'uCenter', 'uLo', 'uHi', 'uLog', 'uSigned', 'uRelief', 'uNormal', 'uStops',
                      'uLine', 'uLineColor', 'uShade']) uni[name] = gl.getUniformLocation(prog, name);
  const aPos = gl.getAttribLocation(prog, 'aPos'), aVal = gl.getAttribLocation(prog, 'aVal');
  for (const L of LAYERS) {
    L.vao = gl.createVertexArray(); gl.bindVertexArray(L.vao);
    vertexBuffer(aPos, L.pos, 3, gl.STATIC_DRAW);
    L.valBuf = vertexBuffer(aVal, new Float32Array(2 * L.n), 2, gl.DYNAMIC_DRAW);
    L.triBuf = indexBuffer(L.tri);
    L.edgeBuf = L.edges ? indexBuffer(L.edges) : null;
  }
  // outline of the layers' box: 12 edges, every vertex valued (aVal = (0, 1))
  const c = [[bmin[0], bmin[1], bmin[2]], [bmax[0], bmin[1], bmin[2]], [bmax[0], bmax[1], bmin[2]], [bmin[0], bmax[1], bmin[2]],
             [bmin[0], bmin[1], bmax[2]], [bmax[0], bmin[1], bmax[2]], [bmax[0], bmax[1], bmax[2]], [bmin[0], bmax[1], bmax[2]]];
  const order = [0, 1, 1, 2, 2, 3, 3, 0, 4, 5, 5, 6, 6, 7, 7, 4, 0, 4, 1, 5, 2, 6, 3, 7];
  const box = new Float32Array(order.flatMap((i) => c[i])); boxCount = order.length;
  boxVao = gl.createVertexArray(); gl.bindVertexArray(boxVao);
  vertexBuffer(aPos, box, 3, gl.STATIC_DRAW);
  const ok = new Float32Array(2 * boxCount); for (let i = 0; i < boxCount; i++) ok[2 * i + 1] = 1;
  vertexBuffer(aVal, ok, 2, gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  gl.enable(gl.DEPTH_TEST);
  ready = true;
}
function uploadFrame() {
  if (!gl || !ready) return;
  const values = frameValues(state.frame);
  LAYERS.forEach((L, i) => { gl.bindBuffer(gl.ARRAY_BUFFER, L.valBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, values[i]); });
}

// ---------- camera ----------
function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
function norm(a) { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
const UP = [0, 0, 1];
const E1 = [-1, 0, 0], E2 = [0, -1, 0];      // azimuth 0 looks from -x; +90 deg from -y (2D: x right, y up)
const cam = { az: 0, el: 0, dist: 1, target: [0, 0, 0] };
function resetCamera() {
  if (is2d) { cam.az = Math.PI / 2; cam.el = 89.4 * Math.PI / 180; }
  else { cam.az = 2.2; cam.el = 0.42; }        // eye at +x, -y, +z: x to the right, y into the view
  if (DATA.view) { cam.az = DATA.view[0] * Math.PI / 180; cam.el = DATA.view[1] * Math.PI / 180; }
  cam.target = [0, 0, 0];
  fitDistance();
}
function reliefHeight() { return state.relief * 0.3 * sceneSize; }
function fitDistance() { const fov = 30 * Math.PI / 180; const aspect = canvas.width / Math.max(canvas.height, 1);
  const span = [bmax[0] - bmin[0], bmax[1] - bmin[1], bmax[2] - bmin[2] + (is2d ? reliefHeight() : 0)];
  const r = 0.5 * Math.hypot(span[0], span[1], span[2]) || 1;
  const h = r / Math.tan(fov / 2), w = r / (Math.tan(fov / 2) * Math.min(aspect, 1.0));
  cam.dist = Math.max(h, w) * (is2d ? 0.92 : 0.86); }
function eyeDir() { const c = Math.cos(cam.el); return [0, 1, 2].map((i) => c * (Math.cos(cam.az) * E1[i] + Math.sin(cam.az) * E2[i]) + Math.sin(cam.el) * UP[i]); }
function viewMatrix() {
  const d = eyeDir(); const eye = cam.target.map((t, i) => t + cam.dist * d[i]);
  const f = norm(sub(cam.target, eye)); let s = norm(cross(f, UP)); if (!isFinite(s[0])) s = E1; const u = cross(s, f);
  return new Float32Array([s[0], u[0], -f[0], 0, s[1], u[1], -f[1], 0, s[2], u[2], -f[2], 0,
    -dot(s, eye), -dot(u, eye), dot(f, eye), 1]);
}
function projMatrix() { const fov = 30 * Math.PI / 180, a = canvas.width / Math.max(canvas.height, 1);
  const n = cam.dist * 0.02, fa = cam.dist * 20, t = 1 / Math.tan(fov / 2);
  return new Float32Array([t / a, 0, 0, 0, 0, t, 0, 0, 0, 0, (fa + n) / (n - fa), -1, 0, 0, 2 * fa * n / (n - fa), 0]); }

// ---------- drawing ----------
function cssColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function cssRgb(name) { const v = cssColor(name); if (v.startsWith('#')) return hexRgb(v);
  const m = v.match(/[\d.]+/g); return m ? [m[0] / 255, m[1] / 255, m[2] / 255] : [0.5, 0.5, 0.5]; }
let themeColors = null;
function readTheme() { const dark = getComputedStyle(document.documentElement).colorScheme === 'dark';
  themeColors = { clearTop: cssRgb('--view-top'), clearBottom: cssRgb('--view-bottom'), dark,
    line: dark ? [0.02, 0.03, 0.05, 0.45] : [0.06, 0.08, 0.12, 0.28],
    box: dark ? [0.75, 0.8, 0.9, 0.55] : [0.25, 0.3, 0.4, 0.55] }; }
function resize() {
  const r = canvas.getBoundingClientRect(); const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}
function draw() {
  if (!gl || !ready) return;
  resize();
  gl.viewport(0, 0, canvas.width, canvas.height);
  const bg = themeColors.clearBottom.map((v, i) => 0.5 * (v + themeColors.clearTop[i]));
  gl.clearColor(bg[0], bg[1], bg[2], 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.useProgram(prog);
  const [lo, hi] = limits();
  const logScale = state.log && LOG_OK;
  gl.uniformMatrix4fv(uni.uView, false, viewMatrix()); gl.uniformMatrix4fv(uni.uProj, false, projMatrix());
  gl.uniform3fv(uni.uCenter, center);
  gl.uniform1f(uni.uLo, lo); gl.uniform1f(uni.uHi, hi);
  gl.uniform1i(uni.uLog, logScale ? 1 : 0); gl.uniform1i(uni.uSigned, SIGNED ? 1 : 0);
  gl.uniform3fv(uni.uStops, new Float32Array(CMAPS[state.cmap].map(hexRgb).flat()));
  const relief = is2d ? reliefHeight() : 0;
  gl.uniform1f(uni.uShade, relief > 0 ? 1 : 0);
  gl.disable(gl.BLEND);
  gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(1, 1);   // fills behind their mesh lines
  gl.uniform1i(uni.uLine, 0);
  for (const L of LAYERS) {
    if (!L.visible) continue;
    gl.uniform3fv(uni.uNormal, L.normal); gl.uniform1f(uni.uRelief, relief);
    gl.bindVertexArray(L.vao); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, L.triBuf);
    gl.drawElements(gl.TRIANGLES, L.tri.length, gl.UNSIGNED_INT, 0);
  }
  gl.disable(gl.POLYGON_OFFSET_FILL);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.uniform1i(uni.uLine, 1);
  if (state.lines) {
    gl.uniform4fv(uni.uLineColor, themeColors.line);
    for (const L of LAYERS) {
      if (!L.visible || !L.edgeBuf) continue;
      gl.uniform3fv(uni.uNormal, L.normal); gl.uniform1f(uni.uRelief, relief);
      gl.bindVertexArray(L.vao); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, L.edgeBuf);
      gl.drawElements(gl.LINES, L.edges.length, gl.UNSIGNED_INT, 0);
    }
  }
  if (state.box && !is2d) {
    gl.uniform4fv(uni.uLineColor, themeColors.box); gl.uniform1f(uni.uRelief, 0);
    gl.bindVertexArray(boxVao); gl.drawArrays(gl.LINES, 0, boxCount);
  }
  gl.disable(gl.BLEND);
  gl.bindVertexArray(null);
}

// ---------- readout and legend ----------
function updateReadout() {
  const F = FRAMES[state.frame];
  const name = Q.label + (Q.unit ? ' (' + Q.unit + ')' : '');
  const label = (F.label || '').replace(/\blambda\b/g, 'λ');
  $('rf').textContent = KIND === 'single' ? (label || Q.label) : (label || 'frame ' + (state.frame + 1));
  const parts = [];
  if (KIND !== 'single' || label) parts.push(Q.label);
  if (F.empty) parts.push('no value in this frame');
  const planes = LAYERS.filter((L) => L.name && L.visible).map((L) => L.name + ' ' + lengthUnit);
  if (planes.length) parts.push(planes.join(', '));
  $('rm').textContent = parts.join('  ·  ');
  $('framev').textContent = NF > 1 ? (state.frame + 1) + ' / ' + NF : '';
  const [lo, hi] = limits();
  $('lgname').textContent = name + (state.log && LOG_OK ? ', log scale' : '');
  $('lgbar').style.background = 'linear-gradient(90deg,' + CMAPS[state.cmap].join(',') + ')';
  $('lglo').textContent = fmtValue(lo, Q.unit);
  $('lgmid').textContent = SIGNED ? '0' : (state.log && LOG_OK ? fmtValue(Math.sqrt(lo * hi), Q.unit) : '');
  $('lghi').textContent = fmtValue(hi, Q.unit);
}

// ---------- controls ----------
function syncControls() {
  $('play').textContent = state.playing ? 'Pause' : 'Play';
  $('frame').value = state.frame;
  $('speedv').textContent = state.fps + ' fps';
  $('rangev').textContent = Math.round(state.range * 100) + ' %';
  $('reliefv').textContent = Math.round(state.relief * 100) + ' %';
  $('log').setAttribute('aria-pressed', String(state.log && LOG_OK));
  $('decades').style.display = state.log && LOG_OK ? '' : 'none';
  $('lines').setAttribute('aria-pressed', String(state.lines));
  $('box').setAttribute('aria-pressed', String(state.box));
  $('spin').setAttribute('aria-pressed', String(state.spin));
  $('present').setAttribute('aria-pressed', String(document.body.classList.contains('present')));
  for (const L of LAYERS) if (L.button) L.button.setAttribute('aria-pressed', String(L.visible));
}
function select(f) { state.frame = ((f % NF) + NF) % NF; uploadFrame(); updateReadout(); syncControls(); }
$('framegroup').style.display = NF > 1 ? '' : 'none';
$('play').style.display = KIND === 'time' ? '' : 'none';
$('speedgroup').style.display = KIND === 'time' ? '' : 'none';
$('scale').style.display = NF > 1 ? '' : 'none';
$('scale').value = state.scale;
$('log').style.display = LOG_OK ? '' : 'none';
$('reliefgroup').style.display = is2d ? '' : 'none';
$('box').style.display = is2d ? 'none' : '';
$('lines').disabled = !LAYERS.some((L) => L.edges);
if ($('lines').disabled) $('lines').title = 'Mesh lines (too many cells to draw them)';
$('frame').max = String(Math.max(NF - 1, 0));
if (LAYERS.length > 1) {
  for (const L of LAYERS) {
    const b = document.createElement('button'); b.textContent = L.name || 'layer ' + (L.index + 1);
    b.title = 'Show / hide this cut plane';
    b.onclick = () => { L.visible = !L.visible; if (!LAYERS.some((x) => x.visible)) L.visible = true; updateReadout(); syncControls(); };
    L.button = b; $('layergroup').appendChild(b);
  }
} else $('layergroup').style.display = 'none';
$('play').onclick = () => { state.playing = !state.playing; syncControls(); };
$('prev').onclick = () => { state.playing = false; select(state.frame - 1); };
$('next').onclick = () => { state.playing = false; select(state.frame + 1); };
$('frame').oninput = (e) => { state.playing = false; select(+e.target.value); };
$('speed').oninput = (e) => { state.fps = +e.target.value; syncControls(); };
$('cmap').onchange = (e) => { state.cmap = e.target.value; store(SIGNED ? 'cmap_signed' : 'cmap', state.cmap); updateReadout(); };
$('scale').onchange = (e) => { state.scale = e.target.value; updateReadout(); };
$('log').onclick = () => { state.log = !state.log; updateReadout(); syncControls(); };
$('decades').onchange = (e) => { state.decades = +e.target.value; updateReadout(); };
$('range').oninput = (e) => { state.range = +e.target.value; updateReadout(); syncControls(); };
$('relief').oninput = (e) => { const was = state.relief; state.relief = +e.target.value;
  if (is2d && was === 0 && state.relief > 0 && cam.el > 1.4) cam.el = 0.75;   // tilt so the relief shows
  fitDistance(); syncControls(); };
$('lines').onclick = () => { state.lines = !state.lines; syncControls(); };
$('box').onclick = () => { state.box = !state.box; syncControls(); };
$('spin').onclick = () => { state.spin = !state.spin; syncControls(); };
$('present').onclick = () => { document.body.classList.toggle('present'); syncControls(); setTimeout(() => { resize(); fitDistance(); }, 0); };
$('theme').onclick = () => {
  const dark = getComputedStyle(document.documentElement).colorScheme === 'dark';
  document.documentElement.dataset.theme = dark ? 'light' : 'dark'; store('theme', document.documentElement.dataset.theme);
  readTheme();
};
function fileStem() { return (DATA.title || 'field').replace(/[^\w.-]+/g, '_').slice(0, 60); }
function download(href, name) { const a = document.createElement('a'); a.href = href; a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); }
$('png').onclick = () => { draw(); download(canvas.toDataURL('image/png'), fileStem() + '.png'); };
let recorder = null;
$('record').onclick = () => {
  if (recorder) { recorder.stop(); return; }
  if (!canvas.captureStream || !window.MediaRecorder) { alert('This browser cannot record the canvas.'); return; }
  const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const type = types.find((t) => MediaRecorder.isTypeSupported(t)) || '';
  const chunks = [];
  recorder = new MediaRecorder(canvas.captureStream(60), type ? { mimeType: type, videoBitsPerSecond: 16e6 } : {});
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
    download(URL.createObjectURL(blob), fileStem() + (blob.type.includes('mp4') ? '.mp4' : '.webm'));
    recorder = null; $('rec').classList.remove('on'); $('record').textContent = 'Record';
    state.spin = spinBefore; syncControls();
  };
  const spinBefore = state.spin;
  // time frames: one pass from the first frame; otherwise one full turn of the view
  let seconds;
  if (KIND === 'time') { select(0); state.playing = true; seconds = NF / state.fps; }
  else { state.spin = true; seconds = 2 * Math.PI / SPIN_RATE; }
  syncControls();
  recorder.start(); $('rec').classList.add('on'); $('record').textContent = 'Stop';
  setTimeout(() => { if (recorder) recorder.stop(); }, 1000 * seconds + 150);
};
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  const k = e.key;
  if (k === ' ' && KIND === 'time') { $('play').click(); e.preventDefault(); }
  else if (k === 'ArrowLeft' && NF > 1) { $('prev').click(); e.preventDefault(); }
  else if (k === 'ArrowRight' && NF > 1) { $('next').click(); e.preventDefault(); }
  else if (k === 'p' || k === 'P') $('present').click();
  else if (k === 'f' || k === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
  else if ((k === 'l' || k === 'L') && !$('lines').disabled) $('lines').click();
  else if ((k === 'b' || k === 'B') && !is2d) $('box').click();
  else if (k === 's' || k === 'S') $('spin').click();
});

// ---------- pointer: orbit, pan, zoom ----------
const pointers = new Map(); let pinch = 0;
canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY, e.shiftKey || e.button === 2]); });
canvas.addEventListener('pointerup', (e) => { pointers.delete(e.pointerId); pinch = 0; });
canvas.addEventListener('pointercancel', (e) => { pointers.delete(e.pointerId); pinch = 0; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  const [px, py, pan] = pointers.get(e.pointerId); const dx = e.clientX - px, dy = e.clientY - py;
  pointers.set(e.pointerId, [e.clientX, e.clientY, pan]);
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch) cam.dist *= pinch / d; pinch = d; return;
  }
  if (pan) {
    const f = norm(eyeDir().map((v) => -v)); let s = norm(cross(f, UP)); if (!isFinite(s[0])) s = E1; const u = cross(s, f);
    const k = cam.dist * 0.0018;
    cam.target = cam.target.map((t, i) => t - (s[i] * dx - u[i] * dy) * k);
  } else {
    cam.az -= dx * 0.008; cam.el = Math.max(-1.55, Math.min(1.56, cam.el + dy * 0.008));
  }
});
canvas.addEventListener('wheel', (e) => { e.preventDefault(); cam.dist *= Math.exp(e.deltaY * 0.0012); }, { passive: false });
canvas.addEventListener('dblclick', () => resetCamera());

// ---------- loop ----------
const SPIN_RATE = 2 * Math.PI / 12;          // one turn in 12 s
let last = performance.now(), frameClock = 0;
function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (state.spin) cam.az -= SPIN_RATE * dt;
  if (state.playing && NF > 1) {
    frameClock += dt * state.fps;
    if (frameClock >= 1) { const steps = Math.floor(frameClock); frameClock -= steps; select(state.frame + steps); }
  }
  draw();
  requestAnimationFrame(tick);
}
readTheme();
const mq = window.matchMedia('(prefers-color-scheme: dark)');
if (mq.addEventListener) mq.addEventListener('change', () => readTheme());
window.addEventListener('resize', () => { resize(); });
if (gl) { try { setupGL(); } catch (err) { $('empty').hidden = false; $('empty').textContent = 'WebGL error: ' + err.message; } }
resize(); resetCamera(); syncControls(); select(0);
window.fieldViewer = { state, select, draw, cam, limits };
requestAnimationFrame(tick);
})();
</script>
</body>
