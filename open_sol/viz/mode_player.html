<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mode player</title>
<!-- open_sol mode player: one self-contained page (no network). viz/mode_player.py fills the data block below. -->
<style>
:root {
  --bg: #f4f5f7;
  --panel: #ffffff;
  --panel-2: #f8f9fb;
  --ink: #16181d;
  --ink-2: #4a5160;
  --ink-3: #7c8494;
  --rule: #e2e5eb;
  --accent: #2f6fdf;
  --accent-ink: #ffffff;
  --gap: rgba(47, 111, 223, 0.10);
  --gap-ink: #2f5fb8;
  --band: #9aa3b2;
  --dot: #3c4352;
  --view-top: #ffffff;
  --view-bottom: #e9ecf2;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 8px 24px rgba(16, 24, 40, 0.06);
  --line: rgba(20, 24, 32, 0.32);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f13;
    --panel: #151820;
    --panel-2: #1a1e27;
    --ink: #eef0f4;
    --ink-2: #b4bac6;
    --ink-3: #7d8594;
    --rule: #262b36;
    --accent: #6ea0ff;
    --accent-ink: #0b0d12;
    --gap: rgba(110, 160, 255, 0.12);
    --gap-ink: #9cbcff;
    --band: #4f5768;
    --dot: #d5d9e1;
    --view-top: #1b1f29;
    --view-bottom: #0f1117;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
    --line: rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f13;
  --panel: #151820;
  --panel-2: #1a1e27;
  --ink: #eef0f4;
  --ink-2: #b4bac6;
  --ink-3: #7d8594;
  --rule: #262b36;
  --accent: #6ea0ff;
  --accent-ink: #0b0d12;
  --gap: rgba(110, 160, 255, 0.12);
  --gap-ink: #9cbcff;
  --band: #4f5768;
  --dot: #d5d9e1;
  --view-top: #1b1f29;
  --view-bottom: #0f1117;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
  --line: rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.num { font-variant-numeric: tabular-nums; }
.app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; gap: 12px; padding: 16px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
header h1 { font-size: 18px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
header p { margin: 2px 0 0; color: var(--ink-3); font-size: 13px; }
.main { display: grid; grid-template-columns: minmax(280px, 34%) 1fr; gap: 12px; min-height: 0; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow);
        min-height: 0; position: relative; overflow: hidden; }
.bands { display: flex; flex-direction: column; }
.bands h2, .card-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
                         color: var(--ink-3); margin: 0; padding: 12px 14px 0; }
#bandsvg { flex: 1; width: 100%; min-height: 0; display: block; }
#bandsvg text { fill: var(--ink-3); font-size: 11px; }
#bandsvg .axis { stroke: var(--rule); }
#bandsvg .grid { stroke: var(--rule); stroke-dasharray: 2 3; }
#bandsvg .band { fill: none; stroke: var(--band); stroke-width: 1.5; }
#bandsvg .gaprect { fill: var(--gap); }
#bandsvg text.gaplabel { fill: var(--gap-ink); font-size: 11px; font-weight: 600; }
#bandsvg .pt { fill: var(--panel); stroke: var(--dot); stroke-width: 1.4; }
#bandsvg .pt.has { fill: var(--dot); cursor: pointer; }
#bandsvg .pt.has:hover { fill: var(--accent); stroke: var(--accent); }
#bandsvg .sel { fill: none; stroke: var(--accent); stroke-width: 2.5; }
#bandsvg .selline { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.6; }
#bandsvg text.axislabel { fill: var(--ink-2); font-size: 12px; }
#bandsvg text.ticklabel-strong { fill: var(--ink-2); font-size: 13px; font-weight: 600; }
.view { background: linear-gradient(180deg, var(--view-top), var(--view-bottom)); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl:active { cursor: grabbing; }
.readout { position: absolute; left: 18px; top: 14px; pointer-events: none; }
.readout .f { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; }
.readout .f small { font-size: 16px; font-weight: 500; color: var(--ink-2); margin-left: 4px; }
.readout .m { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.legend { position: absolute; right: 18px; bottom: 16px; width: 168px; pointer-events: none; font-size: 11px;
          color: var(--ink-3); }
.legend .bar { height: 8px; border-radius: 4px; margin-bottom: 3px; }
.legend .ticks { display: flex; justify-content: space-between; }
.legend .name { color: var(--ink-2); margin-bottom: 4px; }
.hint { position: absolute; left: 18px; bottom: 14px; font-size: 11px; color: var(--ink-3); pointer-events: none; }
.rec { position: absolute; right: 18px; top: 16px; display: none; align-items: center; gap: 6px; font-size: 12px;
       font-weight: 600; color: #e5484d; }
.rec::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #e5484d; }
.rec.on { display: flex; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; background: var(--panel);
            border: 1px solid var(--rule); border-radius: 12px; padding: 10px 14px; box-shadow: var(--shadow); }
.group { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
.group label { white-space: nowrap; }
.sep { width: 1px; align-self: stretch; background: var(--rule); }
button, select { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel-2);
                 border: 1px solid var(--rule); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
button:hover, select:hover { border-color: var(--ink-3); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); min-width: 76px;
                 font-weight: 600; }
button.icon { padding: 5px 8px; min-width: 32px; }
button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
input[type="range"] { width: 110px; accent-color: var(--accent); }
.val { min-width: 42px; color: var(--ink); }
.spacer { flex: 1; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); text-align: center;
         padding: 24px; }
.empty[hidden] { display: none; }   /* the author display above would beat [hidden]: the empty overlay must not
                                      cover the canvas and take its pointer input */
body.present .controls, body.present header p, body.present .hint { display: none; }
body.present .app { padding: 10px; gap: 10px; }
@media (max-width: 820px) {
  .app { height: auto; min-height: 100vh; }
  .main { grid-template-columns: 1fr; }
  .view { aspect-ratio: 4 / 3; order: -1; }
  .bands { height: 320px; }
  .readout .f { font-size: 24px; }
  .legend { width: 120px; }
  .legend .name { display: none; }
  .hint { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1 id="title">Mode player</h1>
      <p id="subtitle"></p>
    </div>
  </header>
  <div class="main">
    <section class="card bands" aria-label="Band diagram">
      <h2 id="bandstitle">Band diagram</h2>
      <svg id="bandsvg" role="img" aria-label="Frequency against wavenumber; click a point to show its mode"></svg>
    </section>
    <section class="card view" aria-label="Mode shape">
      <canvas id="gl"></canvas>
      <div class="readout"><div class="f num" id="rf"></div><div class="m num" id="rm"></div></div>
      <div class="legend" id="legend"><div class="name" id="lgname"></div><div class="bar" id="lgbar"></div>
        <div class="ticks num"><span id="lglo"></span><span id="lgmid"></span><span id="lghi"></span></div></div>
      <div class="hint">Drag to rotate · Shift-drag to pan · Scroll to zoom · Double-click to reset</div>
      <div class="rec" id="rec">REC</div>
      <div class="empty" id="empty" hidden></div>
    </section>
  </div>
  <div class="controls">
    <div class="group">
      <button class="icon" id="prev" title="Previous wavenumber (Left)">&#8592;</button>
      <button class="primary" id="play" title="Play / pause (Space)">Pause</button>
      <button class="icon" id="next" title="Next wavenumber (Right)">&#8594;</button>
    </div>
    <div class="group"><label for="speed">Speed</label><input type="range" id="speed" min="0.05" max="2" step="0.05" value="0.5">
      <span class="val num" id="speedv"></span></div>
    <div class="group"><label for="amp">Amplitude</label><input type="range" id="amp" min="0" max="1" step="0.01" value="0.35">
      <span class="val num" id="ampv"></span></div>
    <div class="group" id="cellsgroup"><label for="cells">Cells</label><input type="range" id="cells" min="1" max="16" step="1" value="5">
      <span class="val num" id="cellsv"></span></div>
    <div class="group"><label for="color">Colour</label>
      <select id="color">
        <option value="1">Displacement |u|</option>
        <option value="0">Mode amplitude</option>
        <option value="2">u_x</option>
        <option value="3">u_y</option>
        <option value="4">u_z</option>
        <option value="5">Plain</option>
      </select>
      <select id="cmap" title="Colour map (sequential for magnitudes, diverging for signed components)"></select>
    </div>
    <div class="group"><button id="lines" aria-pressed="true" title="Mesh lines (L)">Mesh</button>
      <button id="ghost" aria-pressed="false" title="Undeformed outline (G)">Rest shape</button></div>
    <div class="spacer"></div>
    <div class="group">
      <button id="png" title="Save the view as PNG">PNG</button>
      <button id="record" title="Record a few periods of the view as video">Record</button>
      <button id="present" title="Presentation mode (P)">Present</button>
      <button id="theme" title="Light / dark">Theme</button>
    </div>
  </div>
</div>
<script id="mode-data" type="application/json">/*__MODE_DATA__*/null</script>
<script>
'use strict';
(function () {
const DATA = JSON.parse(document.getElementById('mode-data').textContent);
const $ = (id) => document.getElementById(id);

// ---------- small helpers ----------
function store(key, value) { try { if (value === undefined) return localStorage.getItem('mode_player.' + key);
  localStorage.setItem('mode_player.' + key, value); } catch (e) { return null; } return null; }
function b64bytes(text) { const bin = atob(text); const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out.buffer; }
function f32(text) { return new Float32Array(b64bytes(text)); }
function u32(text) { return new Uint32Array(b64bytes(text)); }
function i16(text) { return new Int16Array(b64bytes(text)); }
function niceStep(span, count) { const raw = span / Math.max(count, 1); const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const r = raw / p; return (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * p; }
function fmt(v, digits) { if (!isFinite(v)) return '-'; return Number(v.toPrecision(digits || 4)).toString(); }
const PREFIXES = [[1e12, 'T'], [1e9, 'G'], [1e6, 'M'], [1e3, 'k'], [1, '']];
function freqUnit(maxF) { for (const [s, p] of PREFIXES) if (maxF >= s) return [s, p + 'Hz']; return [1, 'Hz']; }
function hexRgb(h) { return [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255]; }

// 9 stops each; sequential maps colour the magnitudes (0 .. 1), diverging maps the signed components (-1 .. +1, the
// middle stop at 0)
const CMAPS = {
  viridis: ['#440154', '#472d7b', '#3b528b', '#2c728e', '#21918c', '#28ae80', '#5ec962', '#addc30', '#fde725'],
  inferno: ['#000004', '#1f0c48', '#550f6d', '#88226a', '#ba3655', '#e35933', '#f98e09', '#f8c931', '#fcffa4'],
  ice: ['#04051a', '#151a4b', '#1d3a7a', '#1f5f9e', '#2a86b5', '#4fabc4', '#86ccd3', '#c2e7e6', '#f4fbfb'],
  coolwarm: ['#3b4cc0', '#6282ea', '#8db0fe', '#b8d0f9', '#dddcdc', '#f5c4ad', '#f49a7b', '#de604d', '#b40426'],
  rdbu: ['#2166ac', '#4393c3', '#92c5de', '#d1e5f0', '#f7f7f7', '#fddbc7', '#f4a582', '#d6604d', '#b2182b'],
  puor: ['#542788', '#8073ac', '#b2abd2', '#d8daeb', '#f7f7f7', '#fee0b6', '#fdb863', '#e08214', '#b35806'],
  icefire: ['#9be4ff', '#3fa9e6', '#2563b8', '#1b2a5e', '#141414', '#5e1b1b', '#b83a25', '#e6823f', '#ffd59b'],
};
const CMAP_CHOICES = {
  sequential: [['viridis', 'Viridis'], ['inferno', 'Inferno'], ['ice', 'Ice']],
  diverging: [['coolwarm', 'Cool–warm'], ['rdbu', 'Blue–red'], ['puor', 'Purple–orange'], ['icefire', 'Ice–fire (dark middle)']],
};
const isSigned = (color) => color >= 2 && color <= 4;
const cmapKind = () => (isSigned(state.color) ? 'diverging' : 'sequential');
const currentCmap = () => state.cmaps[cmapKind()];

// ---------- data ----------
if (!DATA) { $('empty').hidden = false; $('empty').textContent = 'No mode data in this file.'; return; }
document.title = DATA.title || 'Mode player';
$('title').textContent = DATA.title || 'Mode player';
$('subtitle').textContent = DATA.subtitle || '';
const geo = DATA.geometry;
const POS = f32(geo.positions);
const TRI = u32(geo.triangles);
const NNODE = POS.length / 3;
const NTRI = TRI.length / 3;
const EDGES = geo.edges ? u32(geo.edges) : null;
const lattice = DATA.lattice || null;
const MODES = DATA.modes.map((m, i) => Object.assign({ index: i }, m));
const lengthUnit = DATA.length_unit || 'm';
const up = geo.up || (geo.dimensions === 2 ? [0, 0, 1] : [0, 0, 1]);
const is2d = geo.dimensions === 2;

// bounding box of one cell
const bmin = [Infinity, Infinity, Infinity], bmax = [-Infinity, -Infinity, -Infinity];
for (let i = 0; i < NNODE; i++) for (let c = 0; c < 3; c++) { const v = POS[3 * i + c];
  if (v < bmin[c]) bmin[c] = v; if (v > bmax[c]) bmax[c] = v; }
const center = [0, 1, 2].map((c) => 0.5 * (bmin[c] + bmax[c]));
const cellSize = Math.max(bmax[0] - bmin[0], bmax[1] - bmin[1], bmax[2] - bmin[2]) || 1;

// ---------- state ----------
const state = {
  mode: Math.min(Math.max(DATA.default_mode || 0, 0), MODES.length - 1),
  playing: true, speed: 0.5, amp: 0.35, cells: lattice ? 5 : 1, color: 1,
  cmaps: { sequential: store('cmap') || 'viridis', diverging: store('cmap_signed') || 'coolwarm' },
  lines: true, ghost: false, theta: 0,
};
for (const kind of ['sequential', 'diverging']) {
  if (!CMAP_CHOICES[kind].some(([key]) => key === state.cmaps[kind])) state.cmaps[kind] = CMAP_CHOICES[kind][0][0];
}
function fillCmapChoices() {
  // the colour-map menu lists the maps of the shown quantity's kind and shows its remembered choice
  const select = $('cmap'); const kind = cmapKind();
  select.replaceChildren(...CMAP_CHOICES[kind].map(([key, label]) => new Option(label, key)));
  select.value = state.cmaps[kind];
  select.disabled = state.color === 5;
}
const savedTheme = store('theme');
if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;

// ---------- WebGL ----------
const canvas = $('gl');
const gl = canvas.getContext('webgl2', { antialias: true, alpha: false, preserveDrawingBuffer: false });
if (!gl) { $('empty').hidden = false; $('empty').textContent = 'This browser has no WebGL2: the mode view cannot be drawn.'; }

const VS = `#version 300 es
precision highp float;
precision highp int;
in vec3 aPos; in vec3 aRe; in vec3 aIm; in vec3 aBary;
uniform mat4 uView; uniform mat4 uProj;
uniform float uTheta; uniform float uCellPhase; uniform float uAmp; uniform float uCells; uniform float uPeriod;
uniform vec3 uAxis; uniform vec3 uCenter; uniform int uColor; uniform float uRest;
out vec3 vBary; out float vScalar; out vec3 vViewPos;
void main() {
  float idx = float(gl_InstanceID);
  float psi = uCellPhase * idx + uTheta;   // u = Re[U exp(j (cell_phase n + omega t))]
  vec3 u = aRe * cos(psi) - aIm * sin(psi);
  vec3 p = aPos - uCenter + uAxis * (uPeriod * (idx - 0.5 * (uCells - 1.0))) + (1.0 - uRest) * uAmp * u;
  float s;
  if (uColor == 0) s = sqrt(dot(aRe, aRe) + dot(aIm, aIm));
  else if (uColor == 1) s = length(u);
  else if (uColor == 2) s = 0.5 + 0.5 * u.x;
  else if (uColor == 3) s = 0.5 + 0.5 * u.y;
  else if (uColor == 4) s = 0.5 + 0.5 * u.z;
  else s = 0.0;
  vScalar = s; vBary = aBary;
  vec4 vp = uView * vec4(p, 1.0);
  vViewPos = vp.xyz;
  gl_Position = uProj * vp;
}`;
const FS = `#version 300 es
precision highp float;
precision highp int;
in vec3 vBary; in float vScalar; in vec3 vViewPos;
uniform vec3 uStops[9]; uniform int uColor; uniform float uLines; uniform vec3 uPlain; uniform vec4 uLineColor;
uniform float uRest;
out vec4 outColor;
vec3 cmap(float t) {
  t = clamp(t, 0.0, 1.0) * 8.0;
  int i = int(min(floor(t), 7.0));
  return mix(uStops[i], uStops[i + 1], t - float(i));
}
void main() {
  if (uRest > 0.5) {
    float e = min(min(vBary.x, vBary.y), vBary.z);
    float w = 1.0 - smoothstep(0.0, fwidth(e) * 1.3, e);
    if (w < 0.02) discard;
    outColor = vec4(uLineColor.rgb, uLineColor.a * w);
    return;
  }
  vec3 n = normalize(cross(dFdx(vViewPos), dFdy(vViewPos)));
  vec3 v = normalize(-vViewPos);
  vec3 key = normalize(vec3(0.45, 0.75, 0.55));
  vec3 fill = normalize(vec3(-0.6, -0.25, 0.5));
  float dk = abs(dot(n, key)), df = max(dot(n, fill), 0.0);
  float sp = pow(max(dot(n, normalize(key + v)), 0.0), 40.0);
  float rim = pow(1.0 - max(dot(n, v), 0.0), 3.0);
  vec3 base = (uColor == 5) ? uPlain : cmap(vScalar);
  vec3 col = base * (0.36 + 0.58 * dk + 0.16 * df) + vec3(0.20) * sp + vec3(0.06) * rim;
  float e = min(min(vBary.x, vBary.y), vBary.z);
  float edge = 1.0 - smoothstep(0.0, fwidth(e) * 1.1, e);
  col = mix(col, uLineColor.rgb, edge * uLines * uLineColor.a);
  outColor = vec4(col, 1.0);
}`;

let prog = null, vao = null, buf = {}, uni = {}, ready = false;
function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function setupGL() {
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  for (const name of ['uView', 'uProj', 'uTheta', 'uCellPhase', 'uAmp', 'uCells', 'uPeriod', 'uAxis', 'uCenter', 'uColor',
                      'uStops', 'uLines', 'uPlain', 'uLineColor', 'uRest']) uni[name] = gl.getUniformLocation(prog, name);
  vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const nv = NTRI * 3;
  const pos = new Float32Array(nv * 3), bary = new Float32Array(nv * 3);
  for (let t = 0; t < NTRI; t++) for (let c = 0; c < 3; c++) {
    const n = TRI[3 * t + c], o = 3 * (3 * t + c);
    pos[o] = POS[3 * n]; pos[o + 1] = POS[3 * n + 1]; pos[o + 2] = POS[3 * n + 2]; bary[o + c] = 1;
  }
  buf.pos = attribute('aPos', pos); buf.bary = attribute('aBary', bary);
  buf.re = attribute('aRe', new Float32Array(nv * 3)); buf.im = attribute('aIm', new Float32Array(nv * 3));
  gl.enable(gl.DEPTH_TEST);
  ready = true;
}
function attribute(name, data) { const loc = gl.getAttribLocation(prog, name); const b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
  if (loc >= 0) { gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0); } return b; }

const modeCache = new Map();
function modeArrays(m) {
  if (modeCache.has(m.index)) return modeCache.get(m.index);
  const re = i16(m.re), im = i16(m.im), k = 1 / 32767;
  const nv = NTRI * 3, er = new Float32Array(nv * 3), ei = new Float32Array(nv * 3);
  for (let t = 0; t < NTRI; t++) for (let c = 0; c < 3; c++) {
    const n = TRI[3 * t + c], o = 3 * (3 * t + c);
    for (let d = 0; d < 3; d++) { er[o + d] = re[3 * n + d] * k; ei[o + d] = im[3 * n + d] * k; }
  }
  const out = { re: er, im: ei };
  if (modeCache.size > 24) modeCache.delete(modeCache.keys().next().value);
  modeCache.set(m.index, out);
  return out;
}
function uploadMode() {
  if (!gl || !ready) return;

// ---------- band diagram ----------
const svg = $('bandsvg');

// ---------- selection and navigation ----------

    const ks = [...new Set(MODES.filter((x) => x.k_index != null).map((x) => x.k_index))].sort((a, b) => a - b);

    const k = cam.dist * 0.0018;
    cam.target = cam.target.map((t, i) => t - (s[i] * dx - u[i] * dy) * k);
  } else {
    cam.az -= dx * 0.008; cam.el = Math.max(-1.55, Math.min(1.56, cam.el + dy * 0.008));
  }
});
canvas.addEventListener('wheel', (e) => { e.preventDefault(); cam.dist *= Math.exp(e.deltaY * 0.0012); }, { passive: false });
canvas.addEventListener('dblclick', () => resetCamera());

// ---------- loop ----------
function layout() { resize(); fitDistance(); drawBands(); }
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (state.playing) state.theta = (state.theta + 2 * Math.PI * state.speed * dt) % (2 * Math.PI);
  draw();
  requestAnimationFrame(frame);
}
readTheme();
const mq = window.matchMedia('(prefers-color-scheme: dark)');
if (mq.addEventListener) mq.addEventListener('change', () => { readTheme(); drawBands(); });
window.addEventListener('resize', () => { drawBands(); });
if (gl) { try { setupGL(); } catch (err) { $('empty').hidden = false; $('empty').textContent = 'WebGL error: ' + err.message; } }
fillCmapChoices(); syncControls(); resize(); resetCamera(); uploadMode(); updateReadout(); drawBands();
window.modePlayer = { state, select, draw, cam };
requestAnimationFrame(frame);
})();
</script>
</body>
